server:
  port: 8080

spring:
  application:
    name: javacg2-platform
  datasource:
    # PostgreSQL（默认）
    # 可通过环境变量覆盖：DB_HOST / DB_PORT / DB_NAME / DB_USER / DB_PASS
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:javacg2}
    username: ${DB_USER:javacg2}
    password: ${DB_PASS:javacg2}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 10
  # ── H2 fallback（本地调试用，去掉上方 datasource 改用下方）─────────
  # datasource:
  #   url: jdbc:h2:file:./data/javacg2-platform;AUTO_SERVER=TRUE;CACHE_SIZE=65536
  #   driver-class-name: org.h2.Driver
  #   username: sa
  #   password:
  # h2.console.enabled: true
  # ──────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never  # Hibernate ddl-auto 管理建表，schema.sql 不自动执行
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 1GB
  # Spring AI MCP Server（暴露 Java 调用链图谱工具给 AI 编程助手）
  # AI 编程助手配置：{"mcpServers":{"java-callgraph":{"url":"http://localhost:8080/mcp/sse","transport":"sse"}}}
  ai:
    mcp:
      server:
        name: java-callgraph-mcp
        version: 1.0.0
        enabled: true
        type: SYNC

# 平台配置
platform:
  repo-base-dir: ./data/repos
  analysis-output-dir: ./data/analysis
  sync:
    enabled: false
    cron: "0 0 * * * *"  # 每小时同步
  embedding:
    # Ollama（默认，本地免费）：api-url=http://localhost:11434, model=nomic-embed-text, dimensions=768
    # OpenAI（付费）：api-url=https://api.openai.com, model=text-embedding-3-large, dimensions=3072
    api-url: ${EMBEDDING_URL:http://localhost:11434}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:nomic-embed-text}
    batch-size: ${EMBEDDING_BATCH_SIZE:100}
    dimensions: ${EMBEDDING_DIMENSIONS:768}
  qdrant:
    url: ${QDRANT_URL:http://localhost:6333}
    collection: ${QDRANT_COLLECTION:javacg2_chunks}
