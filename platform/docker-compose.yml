services:
  # ── Qdrant 向量数据库 ──────────────────────────────────────
  # 仅向量数据库使用容器；应用本体（后端 + 前端）通过 ./start.sh 在本地启动
  qdrant:
    image: qdrant/qdrant:v1.9.4
    container_name: javacg2-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q . <&3"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
